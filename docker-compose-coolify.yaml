services:
  migrations:
    image: 'mediacms/mediacms:latest'
    volumes:
      - '/media/2tb/mediacms/media_files:/home/mediacms.io/mediacms/media_files/'
      - '/media/2tb/mediacms/logs:/home/mediacms.io/mediacms/logs/'
      - '/media/2tb/mediacms/secret_key:/home/mediacms.io/mediacms/.secret_key'
    environment:
      ENABLE_UWSGI: ${ENABLE_UWSGI:-no}
      ENABLE_NGINX: ${ENABLE_NGINX:-no}
      ENABLE_CELERY_SHORT: ${ENABLE_CELERY_SHORT:-no}
      ENABLE_CELERY_LONG: ${ENABLE_CELERY_LONG:-no}
      ENABLE_CELERY_BEAT: ${ENABLE_CELERY_BEAT:-no}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mediacms}
      POSTGRES_USER: ${POSTGRES_USER:-mediacms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediacms}
      TZ: ${TZ:-Europe/Moscow}
    command: ./deploy/docker/prestart.sh
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  web:
    image: 'mediacms/mediacms:latest'
    volumes:
      - '/media/2tb/mediacms/media_files:/home/mediacms.io/mediacms/media_files/'
      - '/media/2tb/mediacms/logs:/home/mediacms.io/mediacms/logs/'
      - '/media/2tb/mediacms/secret_key:/home/mediacms.io/mediacms/.secret_key'
    environment:
      ENABLE_UWSGI: ${ENABLE_UWSGI:-yes}
      ENABLE_NGINX: ${ENABLE_NGINX:-no}
      ENABLE_CELERY_BEAT: ${ENABLE_CELERY_BEAT:-no}
      ENABLE_CELERY_SHORT: ${ENABLE_CELERY_SHORT:-no}
      ENABLE_CELERY_LONG: ${ENABLE_CELERY_LONG:-no}
      ENABLE_MIGRATIONS: ${ENABLE_MIGRATIONS:-no}
      POSTGRES_DB: ${POSTGRES_DB:-mediacms}
      POSTGRES_USER: ${POSTGRES_USER:-mediacms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediacms}
      TZ: ${TZ:-Europe/Moscow}
    expose:
      - "${WEB_INTERNAL_PORT:-9000}"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrations:
        condition: service_started

  celery_beat:
    image: 'mediacms/mediacms:latest'
    volumes:
      - '/media/2tb/mediacms/media_files:/home/mediacms.io/mediacms/media_files/'
      - '/media/2tb/mediacms/logs:/home/mediacms.io/mediacms/logs/'
      - '/media/2tb/mediacms/secret_key:/home/mediacms.io/mediacms/.secret_key'
    environment:
      ENABLE_UWSGI: ${ENABLE_UWSGI:-no}
      ENABLE_NGINX: ${ENABLE_NGINX:-no}
      ENABLE_CELERY_SHORT: ${ENABLE_CELERY_SHORT:-no}
      ENABLE_CELERY_LONG: ${ENABLE_CELERY_LONG:-no}
      ENABLE_CELERY_BEAT: 'yes'
      ENABLE_MIGRATIONS: ${ENABLE_MIGRATIONS:-no}
      POSTGRES_DB: ${POSTGRES_DB:-mediacms}
      POSTGRES_USER: ${POSTGRES_USER:-mediacms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediacms}
      TZ: ${TZ:-Europe/Moscow}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  celery_worker:
    image: 'mediacms/mediacms:latest'
    volumes:
      - '/media/2tb/mediacms/media_files:/home/mediacms.io/mediacms/media_files/'
      - '/media/2tb/mediacms/logs:/home/mediacms.io/mediacms/logs/'
      - '/media/2tb/mediacms/secret_key:/home/mediacms.io/mediacms/.secret_key'
    environment:
      ENABLE_UWSGI: ${ENABLE_UWSGI:-no}
      ENABLE_NGINX: ${ENABLE_NGINX:-no}
      ENABLE_CELERY_SHORT: 'yes'
      ENABLE_CELERY_LONG: 'yes'
      ENABLE_CELERY_BEAT: ${ENABLE_CELERY_BEAT:-no}
      ENABLE_MIGRATIONS: ${ENABLE_MIGRATIONS:-no}
      POSTGRES_DB: ${POSTGRES_DB:-mediacms}
      POSTGRES_USER: ${POSTGRES_USER:-mediacms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediacms}
      TZ: ${TZ:-Europe/Moscow}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrations:
        condition: service_started

  db:
    image: 'postgres:17.2-alpine'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data/'
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediacms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediacms}
      POSTGRES_DB: ${POSTGRES_DB:-mediacms}
      TZ: ${TZ:-Europe/Moscow}
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}'
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:alpine'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
